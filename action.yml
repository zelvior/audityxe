name: "Audityxe Audit"
description: "Free, unlimited website audit in CI — SEO, accessibility, security headers, performance, DNS/TLS, and more. Optionally comments results on the PR and fails the job below a score threshold."
author: "Zelvior Labs"
branding:
  icon: "check-circle"
  color: "orange"

inputs:
  url:
    description: "The URL to audit."
    required: true
  min-score:
    description: "Fail the job if the overall score (0-100) is below this. Leave empty to never fail on score alone."
    required: false
    default: ""
  deep:
    description: "Use the deep crawl (up to 25 pages, 3 hops) instead of the default fast crawl (homepage sample only)."
    required: false
    default: "false"
  psi-key:
    description: "Your own free Google PageSpeed Insights API key, for a real-browser Lighthouse pass. Optional."
    required: false
    default: ""
  comment-on-pr:
    description: "Post/update a PR comment with the results. Requires 'pull-requests: write' permission on the workflow. Only applies on pull_request events."
    required: false
    default: "true"

outputs:
  overall-score:
    description: "The overall audit score (0-100)."
    value: ${{ steps.audit.outputs.overall }}
  result-file:
    description: "Path to the full JSON audit result, for uploading as an artifact or further processing."
    value: ${{ steps.audit.outputs.result-file }}

runs:
  using: "composite"
  steps:
    - name: Run Audityxe audit
      id: audit
      shell: bash
      # audityxe-cli runs entirely on this runner — no account, no API
      # key, no rate limit. @latest is intentional: a CI audit tool
      # should reflect the audit engine's current checks, the same way
      # the hosted site always does, not a version pinned at whatever
      # day this workflow file was written.
      run: |
        set -e
        ARGS=("${{ inputs.url }}" "--json")
        if [ "${{ inputs.deep }}" = "true" ]; then ARGS+=("--deep"); fi
        if [ -n "${{ inputs.psi-key }}" ]; then ARGS+=("--psi-key" "${{ inputs.psi-key }}"); fi

        set +e
        npx --yes audityxe-cli@latest "${ARGS[@]}" > audityxe-result.json
        AUDIT_EXIT=$?
        set -e

        if [ ! -s audityxe-result.json ] || [ "$AUDIT_EXIT" -ne 0 ]; then
          echo "::error::Audityxe audit failed to run or produced no output for ${{ inputs.url }}."
          exit 1
        fi

        OVERALL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('audityxe-result.json','utf8')).overall)")
        echo "Overall score: $OVERALL/100"
        echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
        echo "result-file=audityxe-result.json" >> "$GITHUB_OUTPUT"

    - name: Comment results on PR
      if: ${{ inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require("fs");
          const result = JSON.parse(fs.readFileSync("audityxe-result.json", "utf8"));
          const marker = "<!-- audityxe-audit-comment -->";

          const statusEmoji = (s) => (s === "good" ? "✅" : s === "warning" ? "⚠️" : "❌");
          const modules = result.modules
            .slice()
            .sort((a, b) => (a.score ?? 100) - (b.score ?? 100))
            .slice(0, 8)
            .map((m) => `| ${statusEmoji(m.status)} ${m.label} | ${m.score === null ? "n/a" : m.score} |`)
            .join("\n");

          const body = `${marker}
          ## 🔍 Audityxe Audit — ${result.url}

          **Overall score: ${result.overall}/100** — ${result.verdict}

          | Module | Score |
          |---|---|
          ${modules}

          <sub>Full report: run \`npx audityxe-cli ${result.url} --json\` locally, or download this run's result-file artifact. Powered by [audityxe-cli](https://www.npmjs.com/package/audityxe-cli) — free and unlimited.</sub>`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Enforce minimum score
      if: ${{ inputs.min-score != '' }}
      shell: bash
      run: |
        OVERALL="${{ steps.audit.outputs.overall }}"
        MIN="${{ inputs.min-score }}"
        if awk -v o="$OVERALL" -v m="$MIN" 'BEGIN { exit !(o+0 < m+0) }'; then
          echo "::error::Overall score $OVERALL is below min-score $MIN for ${{ inputs.url }}."
          exit 1
        fi
        echo "Score $OVERALL meets the min-score threshold of $MIN."
